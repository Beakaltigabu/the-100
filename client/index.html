        <h1>THE 100 — 100 Day Commitment Challenge</h1>
        <p>THE 100 is a free 100-day personal movement challenge. Choose your goal — running, walking, run + walk, or cycling — commit for 100 days, and finish what you started. Progress is tracked manually or automatically via Strava, with a bilingual English / Amharic (አማርኛ) community.</p>

        <h2>The Manifesto</h2>
        <p>THE 100 isn't about being the fastest, the strongest, or doing the most. It's about choosing something that matters to you and giving 100% of yourself to it for 100 days.</p>
        <p>We all start somewhere different. Your distance is yours. Your journey is yours. Some days will be easy. Some days, showing up will be the hardest part. Both count.</p>
        <p>Because the real challenge isn't the distance. It's giving your best, keeping your word, and becoming someone you're proud of. We move individually, but we don't move alone.</p>
        <p><strong>100 days. One commitment. Thousands of journeys.</strong></p>
        <p><strong>Start where you are. Give 100%. Show up.</strong></p>

        <h2>How it works</h2>
        <ol>
          <li><strong>Join THE 100</strong> — Create your free account in under a minute.</li>
          <li><strong>Your starting point</strong> — Choose your activity (running, walking, run + walk, cycling) and how much you do each week.</li>
          <li><strong>Choose your goal</strong> — Pick a distance you can commit to, recommended for your level or set your own.</li>
          <li><strong>Commit for 100 days</strong> — Confirm your goal and your 100 days begin. Consistency beats intensity.</li>
          <li><strong>Log and hit milestones</strong> — Record each run, walk, or ride manually or via Strava. Milestones (10, 50, 100 km…) mark the way.</li>
          <li><strong>Finish</strong> — On day 100 you'll have finished what you started. That's the point.</li>
        </ol>

        <h2>Start where you are</h2>
        <p>Choose a starting point that fits you — 20 km, 50 km, 100 km, 200 km, 500 km, 1,000 km or more. Different distances. Same commitment. These are not rankings.</p>

        <h3>What is THE 100?</h3>
        <p>THE 100 is a free 100-day personal movement challenge. You choose a goal — running, walking, run + walk, or cycling — commit for 100 days, and log your progress. The only person you're racing is the person you were 100 days ago.</p>
        <h3>How does the 100-day challenge work?</h3>
        <p>Create a free account, choose your activity and how much you do each week, pick a goal we recommend (or set your own), and commit. Log each activity manually or via Strava, and milestones mark your progress toward day 100.</p>
        <h3>Is THE 100 free?</h3>
        <p>Yes. Creating an account, choosing your goal, logging activities, and joining the community are completely free.</p>
        <h3>What activities count?</h3>
